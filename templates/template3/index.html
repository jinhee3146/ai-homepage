<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결 스튜디오</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <input class="nav-toggle" id="nav-toggle" type="checkbox">
    <div class="masthead-top">
      <a class="logo" href="#top"></a>
      <label class="nav-button" for="nav-toggle">메뉴</label>
    </div>
    <nav class="nav" aria-label="주요 메뉴"></nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow" data-field="hero-eyebrow"></p>
      <h1 data-field="hero-title"></h1>
      <p class="lead" data-field="hero-description"></p>
      <div class="hero-actions"></div>
    </section>

    <section class="frames" aria-label="설계 순서">
      <p class="frames-label"></p>
      <ol></ol>
    </section>

    <section class="about" id="about">
      <p class="kicker"></p>
      <h2></h2>
      <p class="body"></p>
      <dl class="facts"></dl>
    </section>

    <section class="business" id="business">
      <div class="section-head">
        <p class="kicker"></p>
        <h2></h2>
      </div>
      <ul class="services"></ul>
    </section>

    <section class="projects" id="products">
      <div class="section-head">
        <p class="kicker"></p>
        <h2></h2>
      </div>
      <div class="lookbook"></div>
    </section>

    <section class="contact" id="contact">
      <p class="kicker"></p>
      <h2></h2>
      <p class="body"></p>
      <address></address>
      <form class="inquiry" action="#" method="post">
        <p class="form-note" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="footer"></footer>

  <script>
    function text(element, value) {
      if (element) element.textContent = value || "";
    }

    function menuLabel(config, href) {
      var item = (config.menu || []).find(function (entry) {
        return entry && entry.href === href;
      });
      return item ? item.label : "";
    }

    function normalizeMenu(menu) {
      var hrefs = ["#about", "#business", "#products", "#contact"];
      if (!Array.isArray(menu)) return [];
      return menu.slice(0, 4).map(function (item, index) {
        if (typeof item === "string") return { label: item, href: hrefs[index] };
        return { label: item && item.label, href: (item && item.href) || hrefs[index] };
      }).filter(function (item) { return item.label && item.href; });
    }

    function hexToRgb(hex) {
      var value = String(hex || "").replace("#", "").trim();
      if (value.length === 3) {
        value = value.split("").map(function (char) { return char + char; }).join("");
      }
      var number = parseInt(value, 16);
      if (!number && number !== 0) return [140, 106, 74];
      return [(number >> 16) & 255, (number >> 8) & 255, number & 255];
    }

    function mix(hex, target, amount) {
      var base = hexToRgb(hex);
      var into = hexToRgb(target);
      var channels = base.map(function (channel, index) {
        return Math.round(channel + (into[index] - channel) * amount);
      });
      return "rgb(" + channels.join(", ") + ")";
    }

    function applyColor(hex) {
      var root = document.documentElement.style;
      root.setProperty("--accent", hex);
      root.setProperty("--accent-dark", mix(hex, "#000000", 0.35));
      root.setProperty("--frame-a", mix(hex, "#f4efe8", 0.55));
      root.setProperty("--frame-b", mix(hex, "#ffffff", 0.2));
      root.setProperty("--frame-c", mix(hex, "#ffffff", 0.72));
    }

    function render(config) {
      config.menu = normalizeMenu(config.menu);
      applyColor(config.primaryColor || "#8C6A4A");
      document.title = config.companyName + " | " + (config.heroTitle || "");
      document.querySelector('meta[name="description"]').setAttribute("content", config.pageDescription || config.heroDescription || "");

      var logo = document.querySelector(".logo");
      logo.textContent = config.companyName || "";
      var nav = document.querySelector(".nav");
      nav.replaceChildren();
      config.menu.forEach(function (item) {
        var link = document.createElement("a");
        link.href = item.href;
        link.textContent = item.label;
        nav.append(link);
      });

      text(document.querySelector("[data-field='hero-eyebrow']"), config.heroEyebrow);
      text(document.querySelector("[data-field='hero-title']"), config.heroTitle);
      text(document.querySelector("[data-field='hero-description']"), config.heroDescription);
      var actions = document.querySelector(".hero-actions");
      actions.replaceChildren();
      (config.heroActions || []).forEach(function (action) {
        var link = document.createElement("a");
        link.href = action.href;
        link.textContent = action.label;
        link.className = action.ghost ? "pill pill-ghost" : "pill";
        actions.append(link);
      });

      var panel = config.heroPanel || { items: [] };
      text(document.querySelector(".frames-label"), panel.label);
      var frames = document.querySelector(".frames ol");
      frames.replaceChildren();
      (panel.items || []).forEach(function (item, index) {
        var li = document.createElement("li");
        li.className = "frame frame-" + (index + 1);
        var title = document.createElement("strong");
        var description = document.createElement("span");
        title.textContent = item.title;
        description.textContent = item.description;
        li.append(title, description);
        frames.append(li);
      });

      var about = config.about || { facts: [] };
      text(document.querySelector(".about .kicker"), menuLabel(config, "#about"));
      text(document.querySelector(".about h2"), about.title);
      text(document.querySelector(".about .body"), about.body);
      var facts = document.querySelector(".facts");
      facts.replaceChildren();
      (about.facts || []).forEach(function (fact) {
        var wrap = document.createElement("div");
        var value = document.createElement("dd");
        var label = document.createElement("dt");
        value.textContent = fact.value;
        label.textContent = fact.label;
        wrap.append(value, label);
        facts.append(wrap);
      });

      var business = config.business || { items: [] };
      text(document.querySelector(".business .kicker"), menuLabel(config, "#business"));
      text(document.querySelector(".business h2"), business.title);
      var services = document.querySelector(".services");
      services.replaceChildren();
      (business.items || []).forEach(function (item) {
        var li = document.createElement("li");
        var title = document.createElement("h3");
        var description = document.createElement("p");
        title.textContent = item.title;
        description.textContent = item.description;
        li.append(title, description);
        services.append(li);
      });

      var products = config.products || { items: [] };
      text(document.querySelector(".projects .kicker"), menuLabel(config, "#products"));
      text(document.querySelector(".projects h2"), products.title);
      var lookbook = document.querySelector(".lookbook");
      lookbook.replaceChildren();
      (products.items || []).forEach(function (item, index) {
        var article = document.createElement("article");
        var plate = document.createElement("div");
        var copy = document.createElement("div");
        var title = document.createElement("h3");
        var description = document.createElement("p");
        plate.className = "plate plate-" + ((index % 3) + 1);
        title.textContent = item.name;
        description.textContent = item.description;
        copy.append(title, description);
        article.append(plate, copy);
        lookbook.append(article);
      });

      var contact = config.contact || { fields: {} };
      text(document.querySelector(".contact .kicker"), menuLabel(config, "#contact"));
      text(document.querySelector(".contact h2"), contact.title);
      text(document.querySelector(".contact .body"), contact.description);
      var address = document.querySelector("address");
      address.replaceChildren();
      var addressLine = document.createElement("span");
      addressLine.textContent = contact.address || "";
      var phone = document.createElement("a");
      phone.href = "tel:" + String(contact.phone || "").replace(/[^\d+]/g, "");
      phone.textContent = contact.phone || "";
      var email = document.createElement("a");
      email.href = "mailto:" + (contact.email || "");
      email.textContent = contact.email || "";
      address.append(addressLine, phone, email);

      var form = document.querySelector(".inquiry");
      var note = form.querySelector(".form-note");
      form.replaceChildren();
      [
        ["name", contact.fields && contact.fields.name, "text", "name"],
        ["company", contact.fields && contact.fields.company, "text", "organization"],
        ["phone", contact.fields && contact.fields.phone, "tel", "tel"],
        ["message", contact.fields && contact.fields.message, "textarea", null]
      ].forEach(function (field) {
        var label = document.createElement("label");
        label.append(document.createTextNode(field[1] || ""));
        var input = field[2] === "textarea" ? document.createElement("textarea") : document.createElement("input");
        input.name = field[0];
        input.required = true;
        if (field[2] === "textarea") input.rows = 4;
        else input.type = field[2];
        if (field[3]) input.autocomplete = field[3];
        label.append(input);
        form.append(label);
      });
      var button = document.createElement("button");
      button.className = "pill";
      button.type = "submit";
      button.textContent = contact.submit || "상담 남기기";
      form.append(button, note);
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        note.textContent = contact.success || "";
        form.reset();
      });

      var footer = document.querySelector(".footer");
      footer.replaceChildren();
      var brand = document.createElement("p");
      var copy = document.createElement("p");
      brand.textContent = config.companyName;
      copy.textContent = "© " + (config.year || "") + " " + config.companyName;
      footer.append(brand, copy);
    }

    fetch("config.json", { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("config");
        return response.json();
      })
      .then(render)
      .catch(function () {
        var message = document.createElement("p");
        message.className = "load-error";
        message.textContent = "config.json을 읽지 못했습니다. 페이지를 파일로 직접 열면 설정을 불러올 수 없습니다.";
        document.body.prepend(message);
      });
  </script>
</body>
</html>
