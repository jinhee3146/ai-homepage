<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>템플릿 작업 중</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4fbff;
      color: #16181d;
      font-family: Pretendard, "Malgun Gothic", sans-serif;
    }

    main { text-align: center; padding: 32px; }

    h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }

    p { margin: 10px 0 0; color: #5e6672; line-height: 1.7; }

    .spin {
      width: 36px;
      height: 36px;
      margin: 0 auto 18px;
      border: 3px solid #d7e6f5;
      border-top-color: #1554a3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spin"></div>
    <h1>템플릿 작업 중</h1>
    <p>요청하신 내용으로 페이지를 만들고 있습니다.<br>작업이 끝나면 이 창에 완성된 페이지가 열립니다.</p>
  </main>
  <script>
    var jobId = new URLSearchParams(location.search).get("job");
    if (jobId) {
      var timer = setInterval(function () {
        var url = localStorage.getItem("template-result-" + jobId);
        var error = localStorage.getItem("template-error-" + jobId);
        if (url) {
          clearInterval(timer);
          localStorage.removeItem("template-result-" + jobId);
          location.replace(url);
        } else if (error) {
          clearInterval(timer);
          localStorage.removeItem("template-error-" + jobId);
          var spin = document.querySelector(".spin");
          if (spin) spin.remove();
          document.querySelector("h1").textContent = "템플릿을 만들지 못했습니다";
          document.querySelector("p").textContent = error;
          document.title = "템플릿 작업 실패";
        }
      }, 300);
    }
  </script>
</body>
</html>
